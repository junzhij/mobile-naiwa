  <path d="M119.8 393 C117.4 389.1 121.2 383.9 124.7 381.7" stroke="#3B310A" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M131.8 394 C129.5 390 131.2 386.3 134.7 383.1" stroke="#433610" stroke-width="1.9" stroke-linecap="round"/>
