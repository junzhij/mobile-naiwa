  <path d="M60.1 362 C72 359.2 91 358.6 101.3 364.9" stroke="#C49645" stroke-width="1.8" opacity=".3" stroke-linecap="round"/>

  <!-- Main one-piece pear-shaped skin, lit by vector-only radial gradients. -->
  <use href="#bodyShape" fill="url(#body)"/>
  <g clip-path="url(#bodyClip)">
    <rect x="5" y="0" width="200" height="303" fill="url(#headLight)"/>
    <rect x="5" y="0" width="200" height="303" fill="url(#throatShade)"/>
    <rect x="5" y="0" width="200" height="303" fill="url(#chestShadow)"/>
    <rect x="5" y="0" width="200" height="303" fill="url(#bellyLowShadow)"/>
    <path d="M140 15 C173 58 211 134 212 216 C212 258 192 284 168 287 C193 244 192 199 173 141 C161 98 141 64 140 15Z" fill="#FFE06C" opacity=".08"/>
  </g>

