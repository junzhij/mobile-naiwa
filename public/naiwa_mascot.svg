<svg xmlns="http://www.w3.org/2000/svg" width="420" height="804" viewBox="0 0 210 402" fill="none" role="img" aria-label="奶蛙，一只黄橙色、绿色眼睛、双手抱着奶油色肚子的卡通角色">
  <title>奶蛙 · 透明背景 SVG 矢量素材</title>
  <desc>全部由可编辑 SVG 路径、渐变和椭圆构成，透明背景，无嵌入位图、无环境投影。</desc>
  <defs>
