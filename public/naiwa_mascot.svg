      <stop offset=".58" stop-color="#FFCE38"/>
      <stop offset=".81" stop-color="#F0A30D"/>
      <stop offset="1" stop-color="#D98800"/>
    </linearGradient>
    <radialGradient id="headLight" cx="0" cy="0" r="1" gradientTransform="translate(116 28) rotate(137) scale(103 110)" gradientUnits="userSpaceOnUse">
