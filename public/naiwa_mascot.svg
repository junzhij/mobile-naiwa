  <path d="M35 172.2 C30.1 173 23.9 178.3 22.8 184.8 M22.6 186.8 C24.3 189.1 27.7 190.7 31 190.4 M22.3 197 C25 199.2 28.5 200.8 31 200" stroke="#4A3B12" stroke-width=".95" stroke-opacity=".72" stroke-linecap="round" fill="none"/>
  <path d="M25 175 C19 183 20 199 28 203" stroke="#E1C275" stroke-opacity=".21" stroke-width="3.5" stroke-linecap="round" fill="none"/>

