  <path d="M144.1 357 C149.9 359 153.5 363.1 157.5 365.5 C164.4 369.7 169.2 373.5 168 380 C166.6 388.3 152.2 391.4 142.3 393.7 L119.6 393.8 C113 393.6 107.8 391.7 107 387.1 C106.2 381.6 111.4 376.3 119.7 371.7 C126.7 367.8 138.7 360.7 144.1 357Z" fill="url(#footFront)"/>
