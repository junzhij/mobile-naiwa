  <path d="M57.9 271.2 C52.4 302.5 73 346.7 90.9 351" stroke="#B46B01" stroke-opacity=".2" stroke-width="5" stroke-linecap="round"/>

  <!-- Rear foot to the viewer's left -->
  <path d="M83.7 352.6 C88.5 352.5 94.8 355.8 100.4 358.6 C106.5 362.3 108.7 367.5 105.4 370.7 C102 374.2 86.7 371.8 74.3 372.9 L41.3 374.2 C33.3 374.4 28 371.9 30.6 366 C32.9 360.7 40.3 358.9 51.7 358.2 C63.1 356.8 75.5 353.1 83.7 352.6Z" fill="url(#footRear)"/>
